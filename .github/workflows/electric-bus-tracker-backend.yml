name: Deploy Electric Bus Backend

on:
  push:
    branches:
      - main
    paths:
      - electric-bus-tracker/backend/**
      - electric-bus-tracker/dbDDL.sql
      - electric-bus-tracker/dbDML.sql
      - electric-bus-tracker/aws/github-deploy-policy.json
      - .github/workflows/electric-bus-tracker-backend.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  EB_APPLICATION_NAME: electric-bus-tracker
  EB_ENVIRONMENT_NAME: electric-bus-tracker-prod
  EB_BUCKET: electric-bus-tracker-eb-644019536118-ap-south-1
  EB_VERSION_LABEL: electric-bus-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::644019536118:role/electric-bus-github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Package backend
        shell: bash
        run: |
          rm -rf deploy
          mkdir -p deploy
          rsync -av \
            --exclude node_modules \
            --exclude .env \
            --exclude "*.log" \
            electric-bus-tracker/backend/ deploy/
          cp electric-bus-tracker/dbDDL.sql deploy/dbDDL.sql
          cp electric-bus-tracker/dbDML.sql deploy/dbDML.sql
          cd deploy
          zip -r ../${{ env.EB_VERSION_LABEL }}.zip .

      - name: Upload application version
        run: |
          aws s3 cp ${{ env.EB_VERSION_LABEL }}.zip \
            s3://${{ env.EB_BUCKET }}/backend/${{ env.EB_VERSION_LABEL }}.zip

      - name: Create Elastic Beanstalk version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${{ env.EB_APPLICATION_NAME }}" \
            --version-label "${{ env.EB_VERSION_LABEL }}" \
            --source-bundle S3Bucket="${{ env.EB_BUCKET }}",S3Key="backend/${{ env.EB_VERSION_LABEL }}.zip"

      - name: Deploy Elastic Beanstalk environment
        run: |
          aws elasticbeanstalk update-environment \
            --application-name "${{ env.EB_APPLICATION_NAME }}" \
            --environment-name "${{ env.EB_ENVIRONMENT_NAME }}" \
            --version-label "${{ env.EB_VERSION_LABEL }}"

      - name: Wait for deployment
        run: |
          aws elasticbeanstalk wait environment-updated \
            --application-name "${{ env.EB_APPLICATION_NAME }}" \
            --environment-names "${{ env.EB_ENVIRONMENT_NAME }}"

      - name: Show environment status
        if: always()
        run: |
          aws elasticbeanstalk describe-environments \
            --application-name "${{ env.EB_APPLICATION_NAME }}" \
            --environment-names "${{ env.EB_ENVIRONMENT_NAME }}" \
            --query 'Environments[0].{Version:VersionLabel,Status:Status,Health:Health,HealthStatus:HealthStatus}' \
            --output table
