name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - dbDDL.sql
      - dbDML.sql
      - .github/workflows/deploy-backend.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  EB_APPLICATION_NAME: electric-bus-tracker
  EB_ENVIRONMENT_NAME: electric-bus-tracker-prod
  EB_BUCKET: electric-bus-tracker-eb-644019536118-ap-south-1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::644019536118:role/electric-bus-github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Package backend
        shell: bash
        run: |
          rm -rf deploy
          mkdir -p deploy
          rsync -av \
            --exclude node_modules \
            --exclude .env \
            --exclude "*.log" \
            backend/ deploy/
          cp dbDDL.sql deploy/dbDDL.sql
          cp dbDML.sql deploy/dbDML.sql
          cd deploy
          zip -r ../backend-${{ github.sha }}.zip .

      - name: Upload application version
        run: |
          aws s3 cp backend-${{ github.sha }}.zip \
            s3://${{ env.EB_BUCKET }}/backend-${{ github.sha }}.zip

      - name: Create Elastic Beanstalk version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${{ env.EB_APPLICATION_NAME }}" \
            --version-label "${{ github.sha }}" \
            --source-bundle S3Bucket="${{ env.EB_BUCKET }}",S3Key="backend-${{ github.sha }}.zip"

      - name: Deploy Elastic Beanstalk environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${{ env.EB_ENVIRONMENT_NAME }}" \
            --version-label "${{ github.sha }}"

      - name: Wait for deployment
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-names "${{ env.EB_ENVIRONMENT_NAME }}"
